services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["pqm-data:/data"]      # SQLite con el registro de predicciones
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5
  dashboard:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
    depends_on: [api]
volumes:
  pqm-data:
